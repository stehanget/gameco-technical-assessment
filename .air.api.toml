root = "."
tmp_dir = "tmp/air-api"

[build]
cmd = "go build -o ./tmp/air-api/api ./cmd/api"
bin = "./tmp/air-api/api"
full_bin = "./tmp/air-api/api"
include_ext = ["go", "tpl", "tmpl", "html", "env"]
exclude_dir = ["tmp", "vendor", "docs/swagger"]
delay = 500
stop_on_error = true

[log]
time = true
