name: ${APP_NAME:-gameco-technical-assessment}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/stehanget/gameco-technical-assessment-api:latest
    environment:
      APP_NAME: ${APP_NAME:-app}
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      APP_READ_TIMEOUT: ${APP_READ_TIMEOUT:-10s}
      APP_WRITE_TIMEOUT: ${APP_WRITE_TIMEOUT:-10s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-10s}
      APP_MAX_REQUEST_BODY_BYTES: ${APP_MAX_REQUEST_BODY_BYTES:-1048576}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_JWT_PREVIOUS_SECRETS: ${APP_JWT_PREVIOUS_SECRETS:-}
      APP_PAYMENT_WEBHOOK_SECRET: ${APP_PAYMENT_WEBHOOK_SECRET:-}
      APP_PAYMENT_WEBHOOK_EVENT_RETENTION: ${APP_PAYMENT_WEBHOOK_EVENT_RETENTION:-168h}
      APP_PAYMENT_WEBHOOK_CLEANUP_INTERVAL: ${APP_PAYMENT_WEBHOOK_CLEANUP_INTERVAL:-1h}
      APP_CHECKOUT_IDEMPOTENCY_RETENTION: ${APP_CHECKOUT_IDEMPOTENCY_RETENTION:-720h}
      APP_CHECKOUT_IDEMPOTENCY_CLEANUP_INTERVAL: ${APP_CHECKOUT_IDEMPOTENCY_CLEANUP_INTERVAL:-1h}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-24h}
      APP_API_SIGNATURE_ENABLED: ${APP_API_SIGNATURE_ENABLED:-true}
      APP_API_SIGNING_KEYS: ${APP_API_SIGNING_KEYS:-}
      APP_API_SIGNATURE_VERSION: ${APP_API_SIGNATURE_VERSION:-v1}
      APP_API_SIGNATURE_ROTATION_COUNT: ${APP_API_SIGNATURE_ROTATION_COUNT:-4}
      APP_API_SIGNATURE_TIMESTAMP_WINDOW: ${APP_API_SIGNATURE_TIMESTAMP_WINDOW:-5m}
      APP_API_SIGNATURE_NONCE_KEY_PREFIX: ${APP_API_SIGNATURE_NONCE_KEY_PREFIX:-api-signature:nonce:}
      APP_API_SIGNATURE_MAX_BODY_BYTES: ${APP_API_SIGNATURE_MAX_BODY_BYTES:-1048576}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/stehanget/gameco-technical-assessment-worker:latest
    environment:
      APP_NAME: ${APP_NAME:-app}
      APP_ENV: ${APP_ENV:-production}
      APP_MAX_REQUEST_BODY_BYTES: ${APP_MAX_REQUEST_BODY_BYTES:-1048576}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_JWT_PREVIOUS_SECRETS: ${APP_JWT_PREVIOUS_SECRETS:-}
      APP_PAYMENT_WEBHOOK_SECRET: ${APP_PAYMENT_WEBHOOK_SECRET:-}
      APP_PAYMENT_WEBHOOK_EVENT_RETENTION: ${APP_PAYMENT_WEBHOOK_EVENT_RETENTION:-168h}
      APP_PAYMENT_WEBHOOK_CLEANUP_INTERVAL: ${APP_PAYMENT_WEBHOOK_CLEANUP_INTERVAL:-1h}
      APP_CHECKOUT_IDEMPOTENCY_RETENTION: ${APP_CHECKOUT_IDEMPOTENCY_RETENTION:-720h}
      APP_CHECKOUT_IDEMPOTENCY_CLEANUP_INTERVAL: ${APP_CHECKOUT_IDEMPOTENCY_CLEANUP_INTERVAL:-1h}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-24h}
      APP_API_SIGNATURE_ENABLED: ${APP_API_SIGNATURE_ENABLED:-true}
      APP_API_SIGNING_KEYS: ${APP_API_SIGNING_KEYS:-}
      APP_API_SIGNATURE_VERSION: ${APP_API_SIGNATURE_VERSION:-v1}
      APP_API_SIGNATURE_ROTATION_COUNT: ${APP_API_SIGNATURE_ROTATION_COUNT:-4}
      APP_API_SIGNATURE_TIMESTAMP_WINDOW: ${APP_API_SIGNATURE_TIMESTAMP_WINDOW:-5m}
      APP_API_SIGNATURE_NONCE_KEY_PREFIX: ${APP_API_SIGNATURE_NONCE_KEY_PREFIX:-api-signature:nonce:}
      APP_API_SIGNATURE_MAX_BODY_BYTES: ${APP_API_SIGNATURE_MAX_BODY_BYTES:-1048576}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ghcr.io/stehanget/gameco-technical-assessment-migrate:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
