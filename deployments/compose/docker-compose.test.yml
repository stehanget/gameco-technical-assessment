services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameco_integration}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gameco_integration}"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  test-runner:
    image: golang:1.25
    working_dir: /app
    volumes:
      - ../..:/app
      - test_go_mod_cache:/go/pkg/mod
      - test_go_build_cache:/root/.cache/go-build
    environment:
      APP_NAME: ${APP_NAME:-gameco-technical-assessment}
      APP_ENV: test
      APP_PORT: ${APP_PORT:-28081}
      APP_READ_TIMEOUT: ${APP_READ_TIMEOUT:-10s}
      APP_WRITE_TIMEOUT: ${APP_WRITE_TIMEOUT:-10s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-10s}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_JWT_PREVIOUS_SECRETS: ${APP_JWT_PREVIOUS_SECRETS:-}
      APP_PAYMENT_WEBHOOK_SECRET: ${APP_PAYMENT_WEBHOOK_SECRET:?APP_PAYMENT_WEBHOOK_SECRET must be set}
      APP_PAYMENT_WEBHOOK_EVENT_RETENTION: ${APP_PAYMENT_WEBHOOK_EVENT_RETENTION:?APP_PAYMENT_WEBHOOK_EVENT_RETENTION must be set}
      APP_PAYMENT_WEBHOOK_CLEANUP_INTERVAL: ${APP_PAYMENT_WEBHOOK_CLEANUP_INTERVAL:?APP_PAYMENT_WEBHOOK_CLEANUP_INTERVAL must be set}
      APP_CHECKOUT_IDEMPOTENCY_RETENTION: ${APP_CHECKOUT_IDEMPOTENCY_RETENTION:?APP_CHECKOUT_IDEMPOTENCY_RETENTION must be set}
      APP_CHECKOUT_IDEMPOTENCY_CLEANUP_INTERVAL: ${APP_CHECKOUT_IDEMPOTENCY_CLEANUP_INTERVAL:?APP_CHECKOUT_IDEMPOTENCY_CLEANUP_INTERVAL must be set}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-24h}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-gameco_integration}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  test_go_mod_cache:
  test_go_build_cache:
