services:
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.dev
    working_dir: /app
    command: air -c .air.api.toml
    volumes:
      - ../..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      APP_ENV: development
      APP_API_SIGNATURE_ENABLED: ${APP_API_SIGNATURE_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.dev
    working_dir: /app
    command: air -c .air.worker.toml
    volumes:
      - ../..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      APP_ENV: development
      APP_API_SIGNATURE_ENABLED: ${APP_API_SIGNATURE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.migrate
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  go-mod-cache:
  go-build-cache:
