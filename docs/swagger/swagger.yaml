- description: Liveness endpoint for runtime health checks.
  name: health
- description: Buyer cart lifecycle, ownership, quantity replacement, and current
    stock validation.
  name: cart
- description: Buyer checkout, stock reservation, order creation, and idempotent retry
    handling.
  name: checkout
- description: Authenticated buyer order detail and ownership-scoped order reads.
  name: orders
- description: Simulated payment-provider callbacks with HMAC verification and replay
    protection.
  name: payment-webhooks
- description: Public catalog product listing and product detail operations.
  name: products
- description: Canonical category options used by public catalog filters and seller
    product forms.
  name: categories
- description: Authenticated seller product management with ownership authorization.
  name: seller-products
