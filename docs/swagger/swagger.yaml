basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.MessageEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.MessageResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  auth.MessageResponse:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.TokenEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.TokenResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    required:
    - access_token
    - expires_in
    - refresh_token
    - token_type
    - user
    type: object
  auth.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.UserResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  auth.UserResponse:
    properties:
      email:
        type: string
      permissions:
        items:
          type: string
        type: array
      public_id:
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    - permissions
    - public_id
    - roles
    type: object
  cart.CartResponse:
    properties:
      created_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
      items:
        items:
          $ref: '#/definitions/cart.ItemResponse'
        type: array
      public_id:
        type: string
      status:
        type: string
      total_amount:
        type: integer
      unavailable_items:
        items:
          $ref: '#/definitions/cart.ItemResponse'
        type: array
      updated_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
    required:
    - created_at
    - items
    - public_id
    - status
    - total_amount
    - unavailable_items
    - updated_at
    type: object
  cart.ItemResponse:
    properties:
      availability:
        type: string
      name:
        type: string
      price_amount:
        type: integer
      product_public_id:
        type: string
      quantity:
        type: integer
      stock_quantity:
        type: integer
      subtotal_amount:
        type: integer
      unavailable_reason:
        type: string
        x-nullable: true
    required:
    - availability
    - name
    - price_amount
    - product_public_id
    - quantity
    - stock_quantity
    - subtotal_amount
    - unavailable_reason
    type: object
  cart.Response:
    properties:
      data:
        $ref: '#/definitions/cart.CartResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  cart.SetItemRequest:
    properties:
      quantity:
        maximum: 999
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  catalog.CategoryOptionResponse:
    properties:
      name:
        type: string
      public_id:
        type: string
      slug:
        type: string
    required:
    - name
    - public_id
    - slug
    type: object
  catalog.CategoryOptionsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/catalog.CategoryOptionResponse'
        type: array
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  catalog.CategoryResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  catalog.CreateProductRequest:
    properties:
      category_public_id:
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
      price_amount:
        minimum: 0
        type: integer
      stock_quantity:
        minimum: 0
        type: integer
    required:
    - category_public_id
    - description
    - name
    type: object
  catalog.ItemResponse:
    properties:
      data:
        $ref: '#/definitions/catalog.ProductResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  catalog.ListMeta:
    properties:
      has_more:
        type: boolean
      next_cursor:
        type: string
        x-nullable: true
      per_page:
        type: integer
      request_id:
        type: string
        x-nullable: true
    required:
    - has_more
    - next_cursor
    - per_page
    - request_id
    type: object
  catalog.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/catalog.ProductResponse'
        type: array
      meta:
        $ref: '#/definitions/catalog.ListMeta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  catalog.ProductResponse:
    properties:
      category:
        $ref: '#/definitions/catalog.CategoryResponse'
      created_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
      description:
        type: string
      name:
        type: string
      price_amount:
        type: integer
      public_id:
        type: string
      stock_quantity:
        type: integer
      updated_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
    required:
    - category
    - created_at
    - description
    - name
    - price_amount
    - public_id
    - stock_quantity
    - updated_at
    type: object
  catalog.SellerCategory:
    properties:
      name:
        type: string
      public_id:
        type: string
      slug:
        type: string
    required:
    - name
    - public_id
    - slug
    type: object
  catalog.SellerItemResponse:
    properties:
      data:
        $ref: '#/definitions/catalog.SellerProductResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  catalog.SellerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/catalog.SellerProductResponse'
        type: array
      meta:
        $ref: '#/definitions/catalog.ListMeta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  catalog.SellerProductResponse:
    properties:
      category:
        $ref: '#/definitions/catalog.SellerCategory'
      created_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
      description:
        type: string
      name:
        type: string
      price_amount:
        type: integer
      public_id:
        type: string
      status:
        type: string
      stock_quantity:
        type: integer
      updated_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
    required:
    - category
    - created_at
    - description
    - name
    - price_amount
    - public_id
    - status
    - stock_quantity
    - updated_at
    type: object
  catalog.UpdateProductRequest:
    properties:
      category_public_id:
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
      price_amount:
        minimum: 0
        type: integer
      stock_quantity:
        minimum: 0
        type: integer
    type: object
  checkout.OrderItemResponse:
    properties:
      product_name:
        type: string
      product_public_id:
        type: string
      quantity:
        type: integer
      subtotal_amount:
        type: integer
      unit_price_amount:
        type: integer
    required:
    - product_name
    - product_public_id
    - quantity
    - subtotal_amount
    - unit_price_amount
    type: object
  checkout.OrderResponse:
    properties:
      created_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
      items:
        items:
          $ref: '#/definitions/checkout.OrderItemResponse'
        type: array
      payment_reference:
        type: string
      payment_status:
        type: string
      public_id:
        type: string
      status:
        type: string
      total_amount:
        type: integer
    required:
    - created_at
    - items
    - payment_reference
    - payment_status
    - public_id
    - status
    - total_amount
    type: object
  checkout.Response:
    properties:
      data:
        $ref: '#/definitions/checkout.OrderResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  checkout.SellerOrderItemResponse:
    properties:
      product_name:
        type: string
      product_public_id:
        type: string
      quantity:
        type: integer
      subtotal_amount:
        type: integer
      unit_price_amount:
        type: integer
    required:
    - product_name
    - product_public_id
    - quantity
    - subtotal_amount
    - unit_price_amount
    type: object
  checkout.SellerOrderListMeta:
    properties:
      has_more:
        type: boolean
      next_cursor:
        type: string
        x-nullable: true
      per_page:
        type: integer
      request_id:
        type: string
        x-nullable: true
    required:
    - has_more
    - next_cursor
    - per_page
    - request_id
    type: object
  checkout.SellerOrderListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/checkout.SellerOrderResponse'
        type: array
      meta:
        $ref: '#/definitions/checkout.SellerOrderListMeta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  checkout.SellerOrderResponse:
    properties:
      created_at:
        example: "2026-10-21T10:15:30Z"
        format: date-time
        type: string
      items:
        items:
          $ref: '#/definitions/checkout.SellerOrderItemResponse'
        type: array
      payment_status:
        type: string
      public_id:
        type: string
      seller_total_amount:
        type: integer
      status:
        type: string
    required:
    - created_at
    - items
    - payment_status
    - public_id
    - seller_total_amount
    - status
    type: object
  example.CreateRequest:
    properties:
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - name
    type: object
  example.EnqueueItemResponse:
    properties:
      data:
        $ref: '#/definitions/example.EnqueueResponse'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  example.EnqueueResponse:
    properties:
      id:
        type: string
      queue:
        type: string
      state:
        type: string
      type:
        type: string
    required:
    - id
    - queue
    - state
    - type
    type: object
  example.ItemResponse:
    properties:
      data:
        $ref: '#/definitions/example.Response'
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  example.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/example.Response'
        type: array
      meta:
        $ref: '#/definitions/httpx.Meta'
      success:
        type: boolean
    required:
    - data
    - meta
    - success
    type: object
  example.Response:
    properties:
      name:
        type: string
      public_id:
        type: string
    required:
    - name
    - public_id
    type: object
  health.StatusResponse:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  httpx.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
      request_id:
        type: string
        x-nullable: true
      success:
        type: boolean
    required:
    - code
    - message
    - request_id
    - success
    type: object
  httpx.Meta:
    properties:
      request_id:
        type: string
        x-nullable: true
    required:
    - request_id
    type: object
info:
  contact: {}
  description: Gameco marketplace backend technical assessment API with Gin, GORM,
    Goose, JWT + Redis, and Swagger.
  title: gameco-technical-assessment API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns an access token plus refresh token
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes a refresh token session
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      - description: Logout payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user profile
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new access token and refresh token
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      - description: Refresh payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user and returns an access token plus refresh token
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.TokenEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /api/v1/cart:
    get:
      description: Returns the authenticated buyer's active cart and current product
        prices.
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cart.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get active cart
      tags:
      - cart
  /api/v1/cart/items/{product_public_id}:
    delete:
      description: Removes a product from the authenticated buyer's active cart.
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      - description: Product public identifier
        format: uuid
        in: path
        name: product_public_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cart.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove cart item
      tags:
      - cart
    put:
      consumes:
      - application/json
      description: Adds a product to the active cart or replaces its quantity.
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      - description: Product public identifier
        format: uuid
        in: path
        name: product_public_id
        required: true
        type: string
      - description: Cart item quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.SetItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cart.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set cart item quantity
      tags:
      - cart
  /api/v1/categories/options:
    get:
      description: Lists canonical categories for public catalog filters and seller
        product forms
      parameters:
      - description: Trusted integration key ID
        in: header
        name: X-API-Key
        type: string
      - description: Unix timestamp in seconds
        in: header
        name: X-API-Timestamp
        type: string
      - description: Unique request nonce
        in: header
        name: X-API-Nonce
        type: string
      - description: Versioned HMAC signature, for example v1=<hex>
        in: header
        name: X-API-Signature
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CategoryOptionsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List category options
      tags:
